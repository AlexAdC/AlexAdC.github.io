<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
/* Layout: guided player — screenshot stage with live cursor on the left, the step sequence as a rail on the right; stacks on phones.
   Deliberately light-only (client-facing, matches print), so every color is set explicitly here. */
:root {
  --paper: #f6f5f1;          /* page ground, neutral biased toward the accent */
  --sheet: #ffffff;          /* player surface */
  --ink: #1d1b16;            /* primary text */
  --ink-2: #5f5a4e;          /* secondary text */
  --rule: #e3e0d6;           /* hairlines */
  --accent: #a67c12;      /* client/brand accent */
  --accent-ink: #956f10; /* accent dark enough for text on white */
  --accent-soft: #f4efe3; /* tinted fill */
  --shade: rgba(24, 21, 14, .34); /* spotlight dimming */
  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ui-in-shot: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { margin: 0; font: 16px/1.55 var(--body); padding-inline: 16px; padding-block: 28px 48px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 22px; }
header.top { display: grid; gap: 6px; max-width: 72ch; }
.eyebrow { font: 500 12px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
h1 { font: 800 clamp(26px, 3.6vw, 40px)/1.08 var(--display); letter-spacing: -.015em; margin: 0; text-wrap: balance; }
.intro { margin: 4px 0 0; color: var(--ink-2); font-size: 17px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.player { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 14px; display: grid; gap: 14px; min-width: 0;
  box-shadow: 0 1px 2px rgba(29,27,22,.04), 0 12px 32px -18px rgba(29,27,22,.25); }

.stage { position: relative; width: 100%; max-width: 100%; border-radius: 9px; overflow: hidden; background: #ebe9e2; outline: 1px solid var(--rule); }
.stage img.shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; transition: opacity .35s ease; user-select: none; -webkit-user-drag: none; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.spot { position: absolute; border-radius: 7px; outline: calc(2.5px / var(--z, 1)) solid var(--accent); outline-offset: calc(3px / var(--z, 1)); transition: box-shadow .45s ease, opacity .3s ease; }
.spot.focus { box-shadow: 0 0 0 200vmax var(--shade); animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { outline-offset: 3px; outline-color: var(--accent); } 70% { outline-offset: 9px; outline-color: transparent; } 100% { outline-offset: 3px; outline-color: transparent; } }
.badge { position: absolute; --u: calc(1px / var(--z, 1)); top: calc(-12 * var(--u)); left: calc(-12 * var(--u)); min-width: calc(24 * var(--u)); height: calc(24 * var(--u)); padding: 0 calc(6 * var(--u)); border-radius: calc(12 * var(--u)); background: var(--accent); color: #fff;
  font: 600 calc(12 * var(--u))/calc(24 * var(--u)) var(--mono); text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.typed { position: absolute; display: flex; align-items: center; overflow: hidden; white-space: nowrap; color: #1f2328;
  font-family: var(--ui-in-shot); font-size: calc(var(--sh, 500px) * var(--fh) * .42); padding-left: calc(var(--sh, 500px) * var(--fh) * .32); border-radius: 4px; }
.caret { display: inline-block; width: 1.5px; height: 1.15em; margin-left: 1px; background: #1f2328; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.ripple { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2.5px solid var(--accent); background: var(--accent-soft);
  animation: ripple .65s ease-out forwards; }
@keyframes ripple { from { transform: scale(.4); opacity: 1; } to { transform: scale(4.2); opacity: 0; } }
.cam { position: absolute; inset: 0; transform-origin: 0 0; transition: transform .95s cubic-bezier(.45,.05,.25,1); will-change: transform; }
.cam.snap { transition: none; }
.cursor { position: absolute; left: 0; top: 0; width: calc(var(--cw, 24px) / var(--z, 1)); height: auto; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); transform-origin: 2px 2px; will-change: transform; }
.cursor.press svg { transform: scale(.82); transform-origin: 2px 2px; }
.cursor svg { display: block; width: 100%; height: auto; transition: transform .12s ease; }

.done { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(246,245,241,.9); backdrop-filter: blur(3px); padding: 20px; text-align: center; }
.done .card { max-width: 46ch; display: grid; gap: 12px; justify-items: center; }
.done h2 { font: 700 clamp(20px, 2.6vw, 28px)/1.15 var(--display); margin: 0; }
.done p { margin: 0; color: var(--ink-2); }
.check { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }

.caption { display: grid; gap: 4px; padding: 0 4px; min-height: 5.8em; }
.caption .count { font: 500 12px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
.caption h2 { font: 700 22px/1.2 var(--display); margin: 0; letter-spacing: -.01em; }
.caption p { margin: 0; color: var(--ink-2); max-width: 68ch; }

.bar { display: flex; gap: 4px; padding: 0 4px; }
.seg { flex: 1; height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.seg i { display: block; height: 100%; width: 0; background: var(--accent); }
.seg.past i { width: 100%; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 0 4px 2px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 600 15px/1 var(--body); border-radius: 9px; padding: 11px 16px; cursor: pointer; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); display: inline-flex; align-items: center; gap: 8px; }
button:hover { border-color: var(--ink-2); }
button:focus-visible, .rail button:focus-visible, .toggle input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(.94); }
button:disabled { opacity: .4; cursor: default; }
.toggle { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle span { width: 40px; height: 23px; border-radius: 12px; background: var(--rule); position: relative; transition: background .2s; flex: none; }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .2s; }
.toggle input:checked + span { background: var(--accent); }
.toggle input:checked + span::after { transform: translateX(17px); }

.rail { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 10px; display: grid; gap: 2px; min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.rail h3 { font: 500 12px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 6px 8px 8px; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rail button { width: 100%; border: 0; background: transparent; text-align: left; font: 500 15px/1.3 var(--body); padding: 10px 8px; gap: 12px; border-radius: 8px; color: var(--ink-2); }
.rail button:hover { background: var(--paper); }
.rail .n { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 500 12px/1 var(--mono); border: 1.5px solid var(--rule); color: var(--ink-2); background: var(--sheet); }
.rail li.cur button { background: var(--accent-soft); color: var(--ink); }
.rail li.cur .n { border-color: var(--accent); background: var(--accent); color: #fff; }
.rail li.past .n { border-color: var(--accent); color: var(--accent-ink); }
.hint { font-size: 13px; color: var(--ink-2); margin: 8px 8px 4px; }
kbd { font: 500 11px/1 var(--mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--paper); }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }
  .hint { display: none; }
}
@media (max-width: 480px) {
  .player { padding: 10px; }
  button { padding: 10px 12px; font-size: 14px; }
  .caption h2 { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  .cam { transition: none; }
  .spot.focus { animation: none; }
  .caret { animation: none; }
}

/* ---------- Print / PDF: one 16:9 page per step ---------- */
.print { display: none; }
@page { size: 297mm 167mm; margin: 0; }
@media print {
  html, body { background: #fff; padding: 0; }
  .wrap { display: none; }
  .print { display: block; }
  .pg { width: 297mm; height: 166mm; padding: 11mm 13mm; break-after: page; display: grid; gap: 8mm; overflow: hidden; position: relative; }
  .pg:last-child { break-after: auto; }
  .pg.cover { grid-template-columns: 1.1fr 1fr; align-items: center; }
  .pg.cover h1 { font-size: 30pt; }
  .pg.cover .intro { font-size: 12.5pt; }
  .pg.cover ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 2.4mm; counter-reset: s; }
  .pg.cover li { display: flex; gap: 3mm; align-items: baseline; font-size: 11.5pt; }
  .pg.cover li b { font: 500 9pt var(--mono); color: var(--accent-ink); min-width: 7mm; }
  .pg.step { grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); align-items: center; }
  .pshot { position: relative; width: 100%; max-width: 100%; border: .3mm solid var(--rule); border-radius: 2mm; overflow: hidden; }
  .pcam { position: absolute; left: 0; top: 0; width: 100%; transform-origin: 0 0; }
  .pcam img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; }
  .pshot .spot { outline-width: .7mm; outline-offset: .8mm; }
  .pshot .spot.focus { animation: none; box-shadow: 0 0 0 200vmax rgba(24,21,14,.22); }
  .pshot .typed { font-size: calc(var(--ph) * var(--fh) * .42); padding-left: calc(var(--ph) * var(--fh) * .32); }
  .pshot .badge { top: -3.2mm; left: -3.2mm; min-width: 6mm; height: 6mm; font-size: 8pt; line-height: 6mm; border-radius: 3mm; }
  .ptext { display: grid; gap: 3mm; align-content: center; }
  .ptext .count { font: 500 9pt var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
  .ptext h2 { font: 700 19pt/1.15 var(--display); margin: 0; }
  .ptext p { margin: 0; font-size: 12pt; line-height: 1.5; color: var(--ink-2); }
  .foot { position: absolute; left: 13mm; right: 13mm; bottom: 6mm; display: flex; justify-content: space-between; font: 500 8pt var(--mono); color: var(--ink-2); }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>
  </header>

  <div class="app">
    <section class="player" aria-label="Tutorial">
      <div class="stage" id="stage">
        <div class="cam" id="cam">
        <img class="shot" id="shotA" alt="">
        <img class="shot" id="shotB" alt="" style="opacity:0">
        <div class="layer" id="layer"></div>
        <div class="layer" id="fx"></div>
        <div class="cursor" id="cursor" aria-hidden="true">
          <svg viewBox="0 0 20 28"><path d="M2 2 L2 22.5 L7.3 17.6 L10.6 25.4 L14 24 L10.7 16.3 L17.8 16.3 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </div>
        </div>
        <div class="done" id="done" hidden>
          <div class="card">
            <div class="check"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
            <h2 id="doneTitle"></h2>
            <p id="outro"></p>
            <button class="primary" id="again" type="button"></button>
          </div>
        </div>
      </div>
      <div class="bar" id="bar"></div>
      <div class="caption" aria-live="polite">
        <div class="count" id="count"></div>
        <h2 id="stepTitle"></h2>
        <p id="stepBody"></p>
      </div>
      <div class="controls">
        <div class="btns">
          <button type="button" id="prev"></button>
          <button type="button" id="replay"></button>
          <button type="button" class="primary" id="next"></button>
        </div>
        <label class="toggle"><input type="checkbox" id="auto"><span></span><em id="autoLabel" style="font-style:normal"></em></label>
      </div>
    </section>

    <nav class="rail" aria-label="Pasos">
      <h3 id="railTitle"></h3>
      <ol id="rail"></ol>
      <p class="hint" id="hint"></p>
    </nav>
  </div>
</div>

<div class="print" id="print"></div>

    en: { prev: "Back", next: "Next", finish: "Finish", replay: "Replay step", auto: "Autoplay", step: "Step", of: "of",
          steps: "Steps", done: "All done!", again: "Watch again", hint: "Use <kbd>←</kbd> <kbd>→</kbd> to move between steps.", page: "Page" }
  }, D.strings || {})[D.lang] || {};
  const $ = id => document.getElementById(id);
  const stage = $("stage"), cam = $("cam"), layer = $("layer"), fx = $("fx"), cursor = $("cursor");
  const imgs = [$("shotA"), $("shotB")]; let front = 0;
  const N = D.steps.length;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let idx = 0, token = 0, auto = false, cur = { x: .86, y: .82 }; // cursor pos as fractions

  // ---------- static text ----------
  $("eyebrow").textContent = D.subtitle || "";
  $("title").textContent = D.title;
  $("intro").textContent = D.intro || ""; $("intro").hidden = !D.intro;
  $("prev").textContent = "← " + T.prev; $("replay").textContent = "↺ " + T.replay;
  $("autoLabel").textContent = T.auto; $("railTitle").textContent = T.steps;
  $("doneTitle").textContent = T.done; $("outro").textContent = D.outro || ""; $("again").textContent = "↺ " + T.again;
  $("hint").innerHTML = T.hint;
  const rail = $("rail"), bar = $("bar");
  D.steps.forEach((s, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<button type="button"><span class="n">${i + 1}</span><span></span></button>`;
    li.querySelector("span:last-child").textContent = s.title;
    li.querySelector("button").onclick = () => go(i);
    rail.appendChild(li);
    const seg = document.createElement("div"); seg.className = "seg"; seg.innerHTML = "<i></i>"; bar.appendChild(seg);
  });

  // ---------- geometry ----------
  function fit() {
    const s = D.steps[idx], im = D.images[s.img];
    stage.style.aspectRatio = im.w + " / " + im.h;
    const r = stage.getBoundingClientRect();
    stage.style.setProperty("--sh", r.height + "px");
    stage.style.setProperty("--cw", Math.max(15, Math.min(28, r.width / 42)) + "px");
    placeCursor(cur.x, cur.y);
  }
  function placeCursor(fx_, fy) { const r = stage.getBoundingClientRect(); cursor.style.transform = `translate(${fx_ * r.width - 2}px, ${fy * r.height - 2}px)`; }
  new ResizeObserver(fit).observe(stage);

  // ---------- helpers ----------
  class Cancel extends Error {}
  const sleep = (ms, tok) => new Promise((res, rej) => setTimeout(() => tok !== token ? rej(new Cancel()) : res(), reduce ? Math.min(ms, 60) : ms));
  function boxStyle(el, t, pad = 0) {
    el.style.left = (t[0] * 100) + "%"; el.style.top = (t[1] * 100) + "%";
    el.style.width = (t[2] * 100) + "%"; el.style.height = (t[3] * 100) + "%";
  }
  function focusPoint(a) { // where the cursor tip lands
    const [x, y, w, h] = a.t;
    if (a.type === "type") return { x: x + w * .78, y: y + h * .6 };
    return { x: x + w / 2, y: y + h * .55 };
  }
  function addSpot(a, n, host, focus = true) {
    host.querySelectorAll(".spot.focus").forEach(e => e.classList.remove("focus"));
    const el = document.createElement("div"); el.className = "spot" + (focus ? " focus" : ""); boxStyle(el, a.t);
    if (n) { const b = document.createElement("span"); b.className = "badge"; b.textContent = n; el.appendChild(b); }
    host.appendChild(el); return el;
  }
  function addTyped(a, host, full) {
    const el = document.createElement("div"); el.className = "typed"; boxStyle(el, a.t);
    el.style.background = a.bg || "#fff"; el.style.setProperty("--fh", a.t[3]);
    const txt = document.createElement("span"); txt.textContent = full ? a.text : ""; el.appendChild(txt);
    host.appendChild(el); return { el, txt };
  }
  function setImage(key) {
    const src = D.images[key].src;
    if (imgs[front].getAttribute("src") === src) return 0;
    if (!imgs[front].getAttribute("src")) { imgs[front].src = src; return 0; }
    const back = 1 - front; imgs[back].src = src; imgs[back].style.opacity = 1; imgs[front].style.opacity = 0; front = back; return 350;
  }
  async function moveTo(p, tok) {
    const r = stage.getBoundingClientRect();
    const from = cur, dx = p.x - from.x, dy = p.y - from.y;
    const dist = Math.hypot(dx * r.width, dy * r.height);
    const dur = reduce ? 0 : Math.max(450, Math.min(1150, dist * 1.25));
    const mx = from.x + dx / 2 - dy * .12, my = from.y + dy / 2 + dx * .12; // gentle arc
    const px = (fxv, fyv) => `translate(${fxv * r.width - 2}px, ${fyv * r.height - 2}px)`;
    if (dur) {
      const anim = cursor.animate([{ transform: px(from.x, from.y) }, { transform: px(mx, my), offset: .5 }, { transform: px(p.x, p.y) }],
        { duration: dur, easing: "cubic-bezier(.45,.05,.25,1)", fill: "forwards" });
      await new Promise(res => { anim.onfinish = res; anim.oncancel = res; });
      anim.cancel();
    }
    cur = p; placeCursor(p.x, p.y);
    if (tok !== token) throw new Cancel();
  }
  async function clickAt(p, tok) {
    cursor.classList.add("press");
    const rp = document.createElement("div"); rp.className = "ripple"; rp.style.left = p.x * 100 + "%"; rp.style.top = p.y * 100 + "%";
    fx.appendChild(rp); setTimeout(() => rp.remove(), 700);
    await sleep(140, tok); cursor.classList.remove("press");
  }

  // ---------- camera ----------
  function viewFor(acts, forPrint) {
    if (!acts.length) return { z: 1, x: 0, y: 0 };
    const x0 = Math.min(...acts.map(a => a.t[0])), y0 = Math.min(...acts.map(a => a.t[1]));
    const x1 = Math.max(...acts.map(a => a.t[0] + a.t[2])), y1 = Math.max(...acts.map(a => a.t[1] + a.t[3]));
    const w = x1 - x0, h = y1 - y0, narrow = !forPrint && stage.getBoundingClientRect().width < 640;
    let z = narrow ? (D.zoomMobile || 2.6) : (D.zoom || 1.6);
    while (z > 1 && (w * 1.35 > 1 / z || h * 1.6 > 1 / z)) z -= .1;
    z = Math.max(1, z);
    const v = 1 / z, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    return { z, x: Math.min(Math.max(0, cx - v / 2), 1 - v), y: Math.min(Math.max(0, cy - v / 2), 1 - v) };
  }
  function printView(acts, r, A) {
    const zmin = Math.max(1, r / A);
    let x0 = .5, y0 = .5, x1 = .5, y1 = .5;
    if (acts.length) {
      x0 = Math.min(...acts.map(a => a.t[0])); y0 = Math.min(...acts.map(a => a.t[1]));
      x1 = Math.max(...acts.map(a => a.t[0] + a.t[2])); y1 = Math.max(...acts.map(a => a.t[1] + a.t[3]));
    }
    const w = x1 - x0, h = y1 - y0;
    let z = acts.length ? Math.max(zmin, D.zoomPrint || 1.8) : zmin;
    while (z > zmin && (w * 1.3 > 1 / z || h * 1.5 > r / (A * z))) z -= .05;
    z = Math.max(z, zmin);
    const vw = 1 / z, vh = r / (A * z), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    return { z, x: Math.min(Math.max(0, cx - vw / 2), 1 - vw), y: Math.min(Math.max(0, cy - vh / 2), Math.max(0, 1 - vh)) };
  }
  function camTo(v, snap) {
    cam.classList.toggle("snap", !!snap);
    cam.style.transform = `translate(${-v.x * v.z * 100}%, ${-v.y * v.z * 100}%) scale(${v.z})`;
    stage.style.setProperty("--z", v.z);
    if (snap) cam.getBoundingClientRect();
  }

  // ---------- step runner ----------
  function renderUI() {
    const s = D.steps[idx];
    $("count").textContent = `${T.step} ${idx + 1} ${T.of} ${N}`;
    $("stepTitle").textContent = s.title; $("stepBody").textContent = s.body || "";
    $("prev").disabled = idx === 0;
    $("next").textContent = (idx === N - 1 ? T.finish : T.next) + " →";
    [...rail.children].forEach((li, i) => { li.className = i === idx ? "cur" : i < idx ? "past" : ""; });
    [...bar.children].forEach((sg, i) => { sg.className = "seg" + (i < idx ? " past" : ""); sg.firstChild.style.transition = "none"; sg.firstChild.style.width = i < idx ? "100%" : "0"; });
  }
  function renderFinal(i) { // complete still frame of a step
    const s = D.steps[i]; layer.innerHTML = "";
    s.actions.forEach((a, j) => { if (a.type === "type") addTyped(a, layer, true); addSpot(a, s.actions.length > 1 ? j + 1 : 0, layer, j === s.actions.length - 1); });
    if (s.actions.length) { cur = focusPoint(s.actions[s.actions.length - 1]); placeCursor(cur.x, cur.y); }
  }
  async function run(i) {
    const tok = ++token; idx = i; $("done").hidden = true; renderUI();
    const s = D.steps[i]; const wait = setImage(s.img); fit();
    layer.innerHTML = ""; fx.innerHTML = "";
    if (wait || i === 0) camTo({ z: 1, x: 0, y: 0 }, true);
    try {
      await sleep(wait + 350, tok);
      camTo(viewFor(s.actions)); await sleep(reduce ? 0 : 900, tok);
      for (let j = 0; j < s.actions.length; j++) {
        const a = s.actions[j], p = focusPoint(a), n = s.actions.length > 1 ? j + 1 : 0;
        await moveTo(p, tok);
        if (a.type === "click" || a.type === "double_click" || a.type === "type") {
          await clickAt(p, tok); if (a.type === "double_click") await clickAt(p, tok);
        }
        addSpot(a, n, layer);
        if (a.type === "type") {
          const { txt } = addTyped(a, layer, false);
          const caret = document.createElement("i"); caret.className = "caret"; txt.after(caret);
          await sleep(200, tok);
          for (const ch of a.text) { txt.textContent += ch; await sleep(45 + Math.random() * 55, tok); }
          await sleep(350, tok); caret.remove();
        }
        await sleep(a.type === "point" ? 600 : 380, tok);
      }
      if (auto) await autoAdvance(s, tok);
    } catch (e) { if (!(e instanceof Cancel)) throw e; }
  }
  async function autoAdvance(s, tok) {
    const ms = Math.min(8000, 1800 + (s.title.length + (s.body || "").length) * 38);
    const fill = bar.children[idx].firstChild; fill.style.transition = "none"; fill.style.width = "0";
    fill.getBoundingClientRect(); fill.style.transition = `width ${ms}ms linear`; fill.style.width = "100%";
    await sleep(ms, tok);
    idx < N - 1 ? run(idx + 1) : finish();
  }
  function finish() {
    token++; [...bar.children].forEach(sg => sg.className = "seg past");
    [...rail.children].forEach(li => li.className = "past");
    $("done").hidden = false; $("again").focus({ preventScroll: true });
  }
  function go(i) { if (i >= 0 && i < N) run(i); }

  $("next").onclick = () => idx < N - 1 ? go(idx + 1) : finish();
  $("prev").onclick = () => go(idx - 1);
  $("replay").onclick = () => run(idx);
  $("again").onclick = () => { cur = { x: .86, y: .82 }; go(0); };
  $("auto").onchange = e => { auto = e.target.checked; if (auto) run(idx); };
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); idx < N - 1 ? go(idx + 1) : finish(); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(idx - 1); }
  });

  // ---------- first frame: complete at rest, then animate ----------
  renderUI(); setImage(D.steps[0].img); fit(); renderFinal(0); camTo(viewFor(D.steps[0].actions), true);
  setTimeout(() => { if (token === 0) run(0); }, 900);

  // ---------- print pages (used for the PDF) ----------
  const P = $("print");
  const cover = document.createElement("section"); cover.className = "pg cover";
  cover.innerHTML = `<div style="display:grid;gap:4mm"><div class="eyebrow"></div><h1></h1><p class="intro"></p></div><ol></ol>`;
  cover.querySelector(".eyebrow").textContent = D.subtitle || ""; cover.querySelector("h1").textContent = D.title; cover.querySelector(".intro").textContent = D.intro || "";
  D.steps.forEach((s, i) => { const li = document.createElement("li"); li.innerHTML = `<b>${String(i + 1).padStart(2, "0")}</b><span></span>`; li.lastChild.textContent = s.title; cover.querySelector("ol").appendChild(li); });
  P.appendChild(cover);
  D.steps.forEach((s, i) => {
    const pg = document.createElement("section"); pg.className = "pg step";
    const im = D.images[s.img];
    pg.innerHTML = `<div class="pshot"><div class="pcam"><img alt=""><div class="layer"></div></div></div><div class="ptext"><div class="count"></div><h2></h2><p></p></div><div class="foot"><span></span><span></span></div>`;
    pg.querySelector("img").src = im.src;
    const shot = pg.querySelector(".pshot");
    const r = im.w / im.h, A = Math.min(r, 1.55); // printed crop is at most 1.55:1 so the target stays legible
    shot.style.aspectRatio = String(A);
    const pc = pg.querySelector(".pcam"); pc.style.aspectRatio = im.w + " / " + im.h;
    const v = printView(s.actions, r, A);
    pc.style.transform = `translate(${-v.x * v.z * 100}%, ${-v.y * v.z * 100}%) scale(${v.z})`;
    shot.style.setProperty("--z", v.z);
    // physical height of the printed screenshot, for the typed-text size
    shot.style.setProperty("--ph", `calc((297mm - 34mm) * 1.9 / 2.9 * ${im.h / im.w})`);
    const L = pg.querySelector(".layer");
    s.actions.forEach((a, j) => { if (a.type === "type") addTyped(a, L, true); addSpot(a, s.actions.length > 1 ? j + 1 : 0, L, j === s.actions.length - 1); });
    pg.querySelector(".count").textContent = `${T.step} ${i + 1} ${T.of} ${N}`;
    pg.querySelector("h2").textContent = s.title; pg.querySelector("p").textContent = s.body || "";
    pg.querySelector(".foot span").textContent = D.title; pg.querySelector(".foot span:last-child").textContent = `${i + 2}`;
    P.appendChild(pg);
  });
  if (D.outro) {
    const end = document.createElement("section"); end.className = "pg cover";
    end.innerHTML = `<div style="display:grid;gap:4mm;grid-column:1/-1;max-width:150mm"><div class="eyebrow"></div><h1></h1><p class="intro"></p></div>`;
    end.querySelector(".eyebrow").textContent = D.title; end.querySelector("h1").textContent = T.done; end.querySelector(".intro").textContent = D.outro;
    P.appendChild(end);
  }
})();
</script>

</body>
</html>

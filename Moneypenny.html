<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moneypenny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--bg-subtle:#f8f8f7;--bg-raised:#ffffff;--bg-hover:#f1f1f0;--bg-active:#ebebea;
  --line:#e8e8e6;--line-control:#8f8f8f;
  --ink:#171717;--ink-muted:#5c5c5c;--ink-faint:#6b6b6b;--on-ink:#ffffff;
  --accent:#c2410c;--accent-soft:#fff1e8;--on-accent:#ffffff;
  --success:#15803d;--success-soft:#ecf8ef;--danger:#b91c1c;--danger-soft:#fdeeee;
  --shadow-xs:0 1px 2px #0000000a;--shadow-md:0 4px 12px #00000014,0 1px 3px #0000000d;
  --focus-ring:0 0 0 2px #ffffff,0 0 0 4px #c2410c;
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:18px;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#141414;--bg-subtle:#1a1a1a;--bg-raised:#1e1e1e;--bg-hover:#222222;--bg-active:#2a2a2a;
  --line:#2a2a2a;--line-control:#6e6e6e;
  --ink:#ededed;--ink-muted:#a8a8a8;--ink-faint:#8f8f8f;--on-ink:#141414;
  --accent:#f08a4b;--accent-soft:#33190b;--on-accent:#141414;
  --success:#4ade80;--success-soft:#11281a;--danger:#f87171;--danger-soft:#2e1414;
  --shadow-xs:0 1px 2px #00000066;--shadow-md:0 8px 24px #000000b3;
  --focus-ring:0 0 0 2px #141414,0 0 0 4px #f08a4b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:400 13px/20px var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
svg.i{flex:none;display:block}
.t-display{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em}
.t-title{font-size:18px;line-height:26px;font-weight:600;letter-spacing:-.01em}
.t-heading{font-size:14px;line-height:20px;font-weight:600}
.t-label{font-size:13px;line-height:18px;font-weight:500}
.t-caption{font-size:12px;line-height:16px}
.t-micro{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.01em}
.t-id{font:400 11px/16px var(--mono)}
.t-code{font:400 12px/18px var(--mono)}
.muted{color:var(--ink-muted)}.faint{color:var(--ink-faint)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg-raised);color:var(--ink);font-size:13px;line-height:18px;font-weight:500;white-space:nowrap;text-decoration:none;flex:none}
.btn:hover{background:var(--bg-hover)}
.btn.sm{height:28px;padding:0 10px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-muted)}
.btn.ghost:hover{background:var(--bg-hover);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.icon{width:32px;padding:0}.btn.icon.sm{width:28px}
.btn[disabled]{opacity:.45;pointer-events:none}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--bg-raised);border:1px solid var(--line-control);border-radius:var(--r-sm);height:32px;padding:0 10px;min-width:0}
input[type=checkbox],input[type=radio]{height:auto;accent-color:var(--ink)}
select{padding-right:6px}
textarea{height:auto;padding:8px 10px;resize:vertical;line-height:20px}
input::placeholder,textarea::placeholder{color:var(--ink-faint)}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:var(--r-xs);font-size:11px;line-height:14px;font-weight:500;background:var(--bg-hover);color:var(--ink-muted);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.success{background:var(--success-soft);color:var(--success)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.line{background:transparent;border:1px solid var(--line)}
.av{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:9999px;background:var(--bg-active);color:var(--ink-muted);font-size:10px;font-weight:600;letter-spacing:.01em;flex:none}
.av.lg{width:28px;height:28px;font-size:11px}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-subtle);padding:24px}
.login-card{width:300px;background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px 24px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.login-card .lk{width:40px;height:40px;border-radius:9999px;background:var(--bg-hover);display:flex;align-items:center;justify-content:center;color:var(--ink-muted);margin-bottom:12px}
.dots{display:flex;gap:12px;margin:20px 0 4px}
.dots i{width:12px;height:12px;border-radius:9999px;border:1.5px solid var(--line-control)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pin-err{height:16px;color:var(--danger)}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;margin-top:12px}
.keypad button{height:48px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--bg-raised);font-size:18px;font-weight:500}
.keypad button:hover{background:var(--bg-hover)}
.keypad .blank{visibility:hidden}
.keypad .bk{display:flex;align-items:center;justify-content:center;color:var(--ink-muted)}

/* layout */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;height:52px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.brand .mk{width:22px;height:22px;border-radius:var(--r-sm);background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.nav{display:flex;gap:2px;overflow-x:auto}
.nav button{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r-md);border:0;background:transparent;color:var(--ink-muted);font-weight:500;white-space:nowrap}
.nav button:hover{background:var(--bg-hover);color:var(--ink)}
.nav button.on{background:var(--bg-active);color:var(--ink)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.top-right .saved{margin-right:8px}
main{padding:16px 16px 48px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1}

/* week header */
.week-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;flex:none}
.week-head .when{display:flex;align-items:center;gap:8px}
.focus-sel{display:flex;align-items:center;gap:6px}
.focus-sel select{height:28px}
.strip{display:flex;gap:4px;overflow-x:auto;padding:2px 2px 10px;flex:none}
.wchip{display:flex;flex-direction:column;gap:4px;flex:1 0 auto;padding:6px 9px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--bg-raised);text-align:left}
.wchip:hover{background:var(--bg-hover)}
.wchip.on{background:var(--bg-active);border-color:var(--bg-active)}
.wchip .l1,.wchip .l2{display:flex;align-items:center;gap:6px;white-space:nowrap}
.wchip .l2{justify-content:space-between}
.wchip.on .faint{color:var(--ink-muted)}
.wchip.now .l1::after{content:"";width:5px;height:5px;border-radius:9999px;background:var(--ink)}
.wchip .bars{display:flex;gap:1px}
.wchip .bars i{width:3px;height:8px;border-radius:1px;background:var(--bg-active)}
.wchip .bars i.f{background:var(--ink-muted)}
.wchip.on .bars i{background:var(--bg-raised)}
.wchip.on .bars i.f{background:var(--ink-muted)}

/* week body */
.week-body{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:stretch}
@media (max-width:1240px){.week-body{grid-template-columns:minmax(0,1fr)}}
.board-wrap{overflow:auto;padding-bottom:2px}
.board{display:grid;grid-template-columns:minmax(150px,176px) 58px repeat(7,minmax(112px,1fr));column-gap:8px;min-width:1080px}
.col{min-width:0}
.col.day,.col.labels{display:grid;grid-template-rows:subgrid}
.col.day{background:var(--bg-subtle);border-radius:var(--r-lg);padding:0 6px 6px}
.col.backlog{background:var(--bg-subtle);border-radius:var(--r-lg);padding:0 6px 6px;display:flex;flex-direction:column;min-height:0}
.col-head{height:40px;display:flex;align-items:center;gap:6px;padding:0 4px}
.col.past .col-head{opacity:.6}
.rlabel{padding-top:14px;text-align:right}.rlabel .ls{display:none}
.cell{position:relative;margin-top:6px;min-height:58px;border-radius:var(--r-md);padding:4px;display:flex;flex-direction:column;gap:4px;border:1px solid transparent}
.cell.open{border:1px dashed var(--line-control)}
.cell.open.past{border-color:var(--line)}
.cell.past .card{opacity:.55}
.drop-hint{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:12px;font-weight:500;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:4px;flex:1;min-height:60px;border-radius:var(--r-md);padding:2px;overflow:auto}
.col-hint{padding:0 4px 8px}

/* cards */
[data-c]{--acf:var(--ac);--acb:color-mix(in srgb,var(--ac),#000 13%);--acr:color-mix(in srgb,var(--ac) 60%,var(--bg-subtle))}
[data-theme="dark"] [data-c]{--acf:color-mix(in srgb,var(--ac) 20%,#1e1e1e);--acb:color-mix(in srgb,var(--ac) 42%,#1e1e1e);--acr:color-mix(in srgb,var(--ac) 11%,#1a1a1a)}
@supports (color: oklch(from red l c h)){[data-theme="dark"] [data-c]{--acf:oklch(from var(--ac) 0.32 calc(c * 2.4) h);--acb:oklch(from var(--ac) 0.44 calc(c * 2.6) h);--acr:oklch(from var(--ac) 0.25 calc(c * 1.8) h)}}
.card{position:relative;background:var(--acf,var(--bg-raised));border:1px solid var(--acb,var(--line));border-radius:var(--r-md);padding:6px 8px;cursor:grab;user-select:none;min-width:0}
.card:hover{box-shadow:var(--shadow-xs);border-color:var(--acb,var(--line-control));filter:saturate(1.25)}
.card.tentative{border-style:dashed;border-color:var(--line-control)}
.card.routine{background:var(--acr,transparent);border-color:transparent;padding:3px 6px;color:var(--ink-muted)}
.card.routine:hover{background:var(--acf,var(--bg-hover));box-shadow:none;border-color:transparent}
.card-top{display:flex;align-items:flex-start;gap:6px;min-width:0}
.card-ic{color:var(--ink-muted);padding-top:2px}
.card-title{font-size:13px;line-height:18px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;flex:1;min-width:0}
.card.routine .card-title{font-weight:400;-webkit-line-clamp:1}
.card-title.editing{display:block;-webkit-line-clamp:unset;overflow:visible;outline:none;box-shadow:var(--focus-ring);border-radius:3px;background:var(--bg-raised);color:var(--ink);cursor:text;user-select:text;padding:0 2px}
.card-meta{display:flex;align-items:center;gap:2px;margin-top:5px;flex-wrap:wrap}
.card-meta .t-micro{margin-left:4px}
.card-meta .av{cursor:grab}
.card-meta .av:hover{background:var(--ink-muted);color:var(--bg)}
.card-acts{position:absolute;top:3px;right:3px;display:none;gap:1px;background:var(--bg-raised);border-radius:var(--r-sm);padding:1px;box-shadow:var(--shadow-xs)}
.card:hover .card-acts,.card:focus-within .card-acts{display:flex}
.ca{width:22px;height:22px;border-radius:var(--r-xs);border:0;background:transparent;color:var(--ink-muted);display:flex;align-items:center;justify-content:center;padding:0;text-decoration:none;flex:none}
.ca:hover{background:var(--bg-active);color:var(--ink)}
.is-dragging{opacity:.4}
.drop-hover{background:var(--bg-active)!important;border-color:var(--ink)!important}
.card.drop-hover{box-shadow:0 0 0 2px var(--ink)}

/* trash zone */
.trash{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:none;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:9999px;background:var(--bg-raised);border:1px dashed var(--danger);color:var(--danger);font-weight:500;box-shadow:var(--shadow-md);z-index:40}
body.dragging .trash{display:flex}
.trash.drop-hover{background:var(--danger-soft)!important;border-color:var(--danger)!important}

/* palette */
.palette{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.pcard{background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px}
.pcard-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.pcard-head .grow{flex:1}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.achip{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border:1px solid var(--acb,var(--line));border-radius:var(--r-md);background:var(--acf,var(--bg-raised));cursor:grab;user-select:none;min-width:0}
.achip:hover{filter:saturate(1.3);border-color:var(--line-control)}
.achip .ic{color:var(--ink-muted)}
.achip .nm{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.achip .ct{font-size:12px;color:var(--ink-muted);white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.achip .ct.met{color:var(--success)}
.achip.focus{border-color:var(--ink)}
.people-card{display:flex;flex-direction:column;min-height:0;flex:1}
.psearch{margin-bottom:6px}
.psearch input{height:28px;width:100%}
.plist{flex:1;min-height:0;max-height:460px;overflow:auto;margin:0 -8px;padding:0 2px}
.prow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:var(--r-md);cursor:grab;user-select:none}
.prow:hover{background:var(--bg-hover)}
.pinfo{flex:1;min-width:0}
.pinfo .nm{display:flex;align-items:center;gap:6px}
.pact{display:flex;gap:1px}
.pgroup{display:flex;align-items:center;gap:6px;padding:8px 6px 4px;position:sticky;top:0;background:var(--bg-raised);z-index:1}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{display:inline-flex;align-items:center;gap:3px;color:var(--success);font-size:12px;font-weight:500;justify-content:flex-end}
.empty{color:var(--ink-faint);font-size:12px;padding:4px 6px}
.sep{height:1px;background:var(--line);margin:8px 0}

/* fit the week view to the screen on large displays */
@media (min-width:1241px) and (min-height:620px){
  body.fit #app{height:100vh;display:flex;flex-direction:column}
  body.fit main{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:16px}
  body.fit .week-body{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
  body.fit .board-wrap{min-height:0}
  body.fit .board{min-height:75%}
  body.fit .col.backlog{contain:size}
  body.fit .palette{min-height:0;overflow:hidden}
  body.fit .plist{max-height:none}
}

/* overview */
.ov-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg)}
.ov{display:grid;min-width:1100px}
.ov > div{border-bottom:1px solid var(--line);min-width:0}
.ov .h1,.ov .h2{background:var(--bg-subtle);padding:6px 6px;position:sticky;top:0}
.ov .h1{font-weight:600;font-size:12px;border-left:1px solid var(--line)}
.ov .h2{font-size:11px;color:var(--ink-muted);border-left:1px solid var(--line)}
.ov .h2.day-start{border-left:1px solid var(--line)}
.ov .wk{padding:6px 10px;display:flex;flex-direction:column;justify-content:center;background:var(--bg-raised);border:0;border-bottom:1px solid var(--line);text-align:left}
.ov .wk:hover{background:var(--bg-hover)}
.ov .oc{padding:3px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);min-height:40px}
.ov .oc.daystart{border-left:1px solid var(--line-control)}
.ov .oc.open{background:repeating-linear-gradient(0deg,transparent,transparent)}
.ov .oc .ob{flex:1;border:1px dashed var(--line-control);border-radius:var(--r-xs);background:transparent;min-height:30px}
.ov .oc .ob:hover{background:var(--bg-hover)}
.ov .oc.off{background:var(--bg-subtle)}
.ov .rowcur > *{background:var(--bg-hover)}
.ov .past{opacity:.5}
.opill{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:var(--r-xs);background:var(--acf,var(--bg-raised));border:1px solid var(--acb,var(--line));font-size:11px;line-height:14px;font-weight:500;cursor:grab;min-width:0}
.opill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opill.routine{background:var(--acr,transparent);border-color:transparent;color:var(--ink-muted);font-weight:400}
.opill.tentative{border-style:dashed;border-color:var(--line-control)}
.opill svg{color:var(--ink-muted)}
.ov .sum{padding:6px 10px;display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line)}
.legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:14px;border-radius:3px;display:inline-block}

/* tables */
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{height:28px;padding:0 10px;border-radius:var(--r-sm);border:0;background:transparent;color:var(--ink-muted);font-weight:500}
.tabs button:hover{background:var(--bg-hover);color:var(--ink)}
.tabs button.on{background:var(--bg-active);color:var(--ink)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg)}
table.tbl{width:100%;border-collapse:collapse;min-width:980px}
.tbl th{text-align:left;font-size:12px;font-weight:500;color:var(--ink-muted);background:var(--bg-subtle);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--bg-subtle)}
.pcell{display:flex;align-items:center;gap:8px}

/* settings cards */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;align-items:start}
.scard{background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.scard h3{margin:0 0 2px;font-size:14px;line-height:20px;font-weight:600}
.scard .desc{color:var(--ink-muted);margin:0 0 12px}
.act-row{display:grid;grid-template-columns:28px 1fr 64px 112px 104px 28px;gap:6px;align-items:center;margin-bottom:6px}
.act-row .ip{display:flex;align-items:center;justify-content:center;color:var(--ink-muted)}
.cwrap{position:relative}
.cbtn{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--acb,var(--line));background:var(--acf,var(--bg-raised));color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.cbtn:hover{border-color:var(--line-control)}
.cpop{position:absolute;top:34px;left:0;z-index:30;width:224px;background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:10px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sw-btn{width:24px;height:24px;border-radius:9999px;border:1px solid var(--acb,var(--line));background:var(--acf);padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.sw-btn.on{box-shadow:0 0 0 2px var(--bg-raised),0 0 0 3.5px var(--ink)}
.cpop .custom{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--ink-muted)}
.cpop input[type=color]{width:36px;height:24px;padding:0 2px;border-radius:var(--r-xs);cursor:pointer}
.act-row input,.act-row select,.rt-row input,.rt-row select{height:28px}
.act-head{color:var(--ink-muted);font-size:12px;margin-bottom:4px}
.free-grid{display:grid;grid-template-columns:76px repeat(7,1fr);gap:4px}
.free-grid .fh{font-size:12px;color:var(--ink-muted);text-align:center}
.free-grid .fl{font-size:12px;color:var(--ink-muted);display:flex;align-items:center}
.ft{height:32px;border-radius:var(--r-sm);border:1px dashed var(--line-control);background:transparent;color:var(--ink-faint);font-size:11px;font-weight:500}
.ft.on{border:1px solid var(--line-control);background:var(--bg-active);color:var(--ink)}
.rt-row{display:grid;grid-template-columns:150px 1fr 120px 28px;gap:6px;align-items:center;margin-bottom:6px}

/* sync */
.code-box{width:100%;min-height:320px;font:400 12px/18px var(--mono);white-space:pre;background:var(--bg-subtle);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;color:var(--ink)}
.dropzone{border:1px dashed var(--line-control);border-radius:var(--r-md);padding:14px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dropzone.drop-hover{background:var(--bg-hover)}
.diff{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;background:var(--bg-subtle)}
.diff ul{margin:6px 0 0;padding-left:18px}
.diff li{margin:2px 0}
.radio{display:inline-flex;align-items:center;gap:6px;margin-right:14px}

/* dialog */
.overlay{position:fixed;inset:0;background:#0000004d;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;z-index:50;overflow:auto}
.dialog{width:460px;max-width:100%;background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-md)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.dlg-body{padding:6px 16px 4px;display:flex;flex-direction:column;gap:12px}
.dlg-foot{display:flex;align-items:center;gap:8px;padding:14px 16px 16px}
.field{display:flex;flex-direction:column;gap:4px}
.field > label,.field > .lbl{font-size:13px;font-weight:500}
.field .hint{font-size:12px;color:var(--ink-muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:2px;align-self:flex-start}
.seg button{height:24px;padding:0 10px;border-radius:4px;border:0;background:transparent;color:var(--ink-muted);font-weight:500;font-size:12px}
.seg button.on{background:var(--bg-active);color:var(--ink)}
.chips-in{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:32px;border:1px solid var(--line-control);border-radius:var(--r-sm);padding:3px 4px}
.chips-in input{border:0;height:24px;flex:1;min-width:120px;padding:0 4px;background:transparent}
.chips-in input:focus-visible{box-shadow:none}
.pchip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 6px;border-radius:var(--r-xs);background:var(--bg-hover);font-size:12px;font-weight:500}
.pchip button{border:0;background:transparent;color:var(--ink-faint);width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:3px}
.pchip button:hover{background:var(--bg-active);color:var(--ink)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--on-ink);padding:10px 14px;border-radius:var(--r-md);box-shadow:var(--shadow-md);transition:.18s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--on-ink);font-weight:600;text-decoration:underline;padding:0}
body.dragging .toast{opacity:0}

@media (max-width:720px){
  .topbar{gap:8px;padding:0 8px}.brand .nm,.top-right .saved{display:none}
  main{padding:12px 10px 40px}
  .grid2{grid-template-columns:1fr}
  .act-row{grid-template-columns:24px 1fr 52px 92px 28px}.act-row .icsel{display:none}
  .nav .nl{display:none}
  .board{grid-template-columns:40px repeat(7,minmax(132px,1fr)) 150px;min-width:0}
  .col.backlog{grid-column:9}
  .rlabel{font-size:11px}.rlabel .lf{display:none}.rlabel .ls{display:inline}
}
</style>

    const a = state.plans.filter(p => (p.week || '__ideas') === w).map(key), b = next.plans.filter(p => (p.week || '__ideas') === w).map(key);
    const bag = arr => arr.reduce((m, k) => (m[k] = (m[k] || 0) + 1, m), {});
    const A = bag(a), B = bag(b); let plus = 0, minus = 0;
    Object.keys(B).forEach(k => plus += Math.max(0, B[k] - (A[k] || 0)));
    Object.keys(A).forEach(k => minus += Math.max(0, A[k] - (B[k] || 0)));
    const fA = state.focus[w] || '', fB = next.focus[w] || '';
    if (plus || minus || fA !== fB) rows.push({w, plus, minus, focus:fA !== fB ? fB || 'none' : null});
    add += plus; rem += minus;
  });
  const names = s => new Set(s.people.map(p => p.name));
  const oldN = names(state), newN = names(next);
  const pAdd = [...newN].filter(n => !oldN.has(n)), pRem = [...oldN].filter(n => !newN.has(n));
  const pChg = next.people.filter(p => { const o = personOf(p.name); return o && JSON.stringify(o) !== JSON.stringify(p); }).length;
  const actChg = JSON.stringify(state.activities) !== JSON.stringify(next.activities);
  const freeChg = JSON.stringify(state.free) !== JSON.stringify(next.free);
  const rtChg = JSON.stringify(state.routine) !== JSON.stringify(next.routine);
  return {next, rows, add, rem, pAdd, pRem, pChg, actChg, freeChg, rtChg, newActs, newPeople, errors:parsed.errors,
    nothing:!add && !rem && !rows.length && !pAdd.length && !pRem.length && !pChg && !actChg && !freeChg && !rtChg};
}

const PROMPT = 'Attached is my Moneypenny planner file (markdown). Please [describe the change, for example: add dinner with Draco next Thursday evening and move Friday gym to lunch on Wednesday]. Keep the exact format described at the top of the file and return the complete file.';
function viewSync() {
  const md = toMarkdown(ui.expPast);
  const lines = md.split('\n').length;

  if (d) {
    const items = [];

    d.rows.slice(0, 14).forEach(r => items.push(`<li class="t-caption muted">${r.w === '__ideas' ? 'Ideas' : 'Week ' + isoWeek(r.w) + ' (' + fmtShort(r.w) + ')'}: ${r.plus ? '+' + r.plus : ''} ${r.minus ? '−' + r.minus : ''}${r.focus ? ' · focus ' + esc(r.focus) : ''}</li>`));
    if (d.rows.length > 14) items.push(`<li class="t-caption muted">${d.rows.length - 14} more weeks</li>`);
    if (d.pAdd.length) items.push(`<li>New people: ${esc(d.pAdd.join(', '))}</li>`);
    if (d.pRem.length) items.push(`<li>Removed people: ${esc(d.pRem.join(', '))}</li>`);

  }

      <textarea class="code-box" readonly aria-label="Markdown export" spellcheck="false">${esc(md)}</textarea>

      <div class="t-caption muted" style="margin-bottom:8px">${esc(PROMPT)}</div>
      <button class="btn sm" data-act="prompt-copy">${icon('copy')}Copy prompt</button></section>

      <div class="dropzone" data-filedrop="1"><span class="muted">${icon('upload', 20)}</span><div class="grow"><div class="t-label">${ui.imp.name ? esc(ui.imp.name) : 'Drop a .md file here'}</div><div class="t-caption muted">or paste the text below</div></div>

      <textarea class="code-box" style="min-height:220px" placeholder="# Moneypenny&#10;...&#10;## Weeks&#10;### 2026-11-09&#10;- Thu evening | Cena con Draco | activity: Friends | with: Draco" data-bind="imp-text" aria-label="Markdown to import" spellcheck="false">${esc(ui.imp.text)}</textarea>
      <div class="row wrap" style="margin-top:10px"><label class="radio t-caption"><input type="radio" name="imode" value="merge" data-bind="imp-mode" ${ui.imp.mode === 'merge' ? 'checked' : ''}>Update weeks in the file</label>
        <label class="radio t-caption"><input type="radio" name="imode" value="replace" data-bind="imp-mode" ${ui.imp.mode === 'replace' ? 'checked' : ''}>Replace everything</label><span class="grow"></span>
        <button class="btn sm" data-act="imp-preview">${icon('eye')}Preview changes</button></div>
      ${diffH}
      <div class="sep"></div>

/* ---------------- toast & clipboard ---------------- */
function toast(msg, withUndo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${withUndo ? '<button data-act="undo">Undo</button>' : ''}`;
  t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 5000);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (er) {} ta.remove(); return ok; }
}
function download(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'text/markdown;charset=utf-8'})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function loadImportText(text, name) { ui.imp.text = text; ui.imp.name = name || ''; previewImport(); }
function previewImport() {
  if (!ui.imp.text.trim()) { ui.imp.diff = null; ui.imp.parsed = null; render(); toast('Paste or load a file first'); return; }
  ui.imp.parsed = parseMarkdown(ui.imp.text);
  if (!ui.imp.parsed.sections.size) { ui.imp.diff = {next:state, rows:[], add:0, rem:0, pAdd:[], pRem:[], pChg:0, newActs:[], newPeople:[], errors:[{line:1, text:'', why:'No Moneypenny sections found (## Weeks, ## People...)'}], nothing:true}; render(); return; }
  ui.imp.diff = diffImport(ui.imp.parsed, ui.imp.mode); render();
}

/* ---------------- events ---------------- */
function setWeek(w) { ui.week = w; render(); }
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]') || e.target.matches('[data-overlay]')) { closeDialog(); return; }
  const el = e.target.closest('[data-act]');
  if (ui.colorOpen !== null && !e.target.closest('.cwrap')) { ui.colorOpen = null; if (!el) { render(); return; } }
  if (!el || el.disabled) return;
  const d = el.dataset;
  switch (d.act) {
    case 'color-open': ui.colorOpen = ui.colorOpen === +d.i ? null : +d.i; render(); break;
    case 'color-set': { const a = state.activities[+d.i]; ui.colorOpen = null; if (a) mutate(`Changed ${a.name} colour`, () => { a.color = d.color; }); else render(); break; }
    case 'view': ui.view = d.view; render(); window.scrollTo(0, 0); break;
    case 'theme': setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true); break;
    case 'lock': store.del(SESSION_KEY, sessionStorage); showLogin(); break;
    case 'undo': undo(); break;
    case 'prev': setWeek(addDays(ui.week, -7)); break;
    case 'next': setWeek(addDays(ui.week, 7)); break;
    case 'today': setWeek(mondayOf(TODAY)); break;
    case 'goweek': ui.view = 'week'; setWeek(d.week); break;
    case 'ptab': ui.ptab = d.t; render(); break;
    case 'toggle-status': { const p = state.plans.find(x => x.id === d.id); if (!p) return;
      mutate(`Marked "${p.title}" as ${p.status === 'tentative' ? 'confirmed' : 'tentative'}`, () => { p.status = p.status === 'tentative' ? 'confirmed' : 'tentative'; }); break; }
    case 'seen': mutate(`Marked ${d.name} as seen today`, () => { personOf(d.name).lastSeen = TODAY; }); break;
    case 'copy': copyText(d.text).then(ok => toast(ok ? 'Message copied' : 'Could not copy')); break;
    case 'filter': ui.filter = d.f; render(); break;
    case 'person-new': personDialog(null); break;
    case 'person-edit': personDialog(d.name); break;
    case 'routine-week': applyRoutine([ui.week]); break;
    case 'free-toggle': mutate(null, () => { const [dk, r] = d.slot.split('-'); const arr = state.free[dk] = state.free[dk] || []; const i = arr.indexOf(r); i >= 0 ? arr.splice(i, 1) : arr.push(r); }); break;
    case 'act-add': mutate(null, () => { let n = 'New activity', k = 2; while (state.activities.some(a => a.name === n)) n = 'New activity ' + k++; state.activities.splice(state.activities.length - 1, 0, {name:n, target:1, best:'any', icon:'circle'}); }); break;
    case 'act-del': { const a = state.activities[+d.i]; const used = state.plans.filter(p => p.activity === a.name).length;
      mutate(`Deleted ${a.name}${used ? `; ${used} plans moved to Other` : ''}`, () => { state.plans.forEach(p => { if (p.activity === a.name) p.activity = 'Other'; }); state.routine.forEach(r => { if (r.activity === a.name) r.activity = 'Other'; }); state.activities.splice(+d.i, 1); }); break; }
    case 'rt-add': mutate(null, () => state.routine.push({slot:freeSlots()[0] || 'mon-evening', title:'Gym', activity:state.activities.some(a => a.name === 'Gym') ? 'Gym' : 'Other'})); break;
    case 'rt-del': mutate('Removed routine item', () => state.routine.splice(+d.i, 1)); break;
    case 'rt-apply': { const cur = mondayOf(TODAY); applyRoutine(Array.from({length:ui.applyWeeks}, (_, i) => addDays(cur, i * 7))); break; }
    case 'exp-dl': download(`moneypenny-${TODAY}.md`, toMarkdown(ui.expPast)); toast('Downloaded the markdown file'); break;
    case 'exp-copy': copyText(toMarkdown(ui.expPast)).then(ok => toast(ok ? 'Markdown copied' : 'Could not copy')); break;
    case 'prompt-copy': copyText(PROMPT).then(ok => toast(ok ? 'Prompt copied' : 'Could not copy')); break;
    case 'imp-file': $('#imp-input').click(); break;
    case 'imp-preview': ui.imp.text = ($('[data-bind="imp-text"]') || {}).value ?? ui.imp.text; previewImport(); break;
    case 'imp-apply': { const d2 = ui.imp.diff; if (!d2) return; mutate(`Imported: ${d2.add} plan${d2.add === 1 ? '' : 's'} added, ${d2.rem} removed`, () => { state = d2.next; }); ui.imp = {text:'', mode:ui.imp.mode, parsed:null, diff:null, name:''}; render(); break; }
    case 'imp-clear': ui.imp = {text:'', mode:ui.imp.mode, parsed:null, diff:null, name:''}; render(); break;
    case 'reset': mutate('Reloaded the spreadsheet data', () => { state = normalize(clone(SEED)); }); break;
  }
});

/* inline rename: double-click a card title */
function startRename(card) {
  const id = card.dataset.id; const t = $('.card-title', card); if (!t || t.isContentEditable) return;
  card.draggable = false; t.contentEditable = 'true'; t.classList.add('editing'); t.focus();
  const r = document.createRange(); r.selectNodeContents(t); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  let done = false;
  const finish = keep => {
    if (done) return; done = true;
    const v = t.textContent.replace(/\s+/g, ' ').trim(); const p = state.plans.find(x => x.id === id);
    if (keep && p && v && v !== p.title) mutate(`Renamed to "${v}"`, () => { p.title = v; }); else render();
  };
  t.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); finish(true); } else if (e.key === 'Escape') { e.preventDefault(); finish(false); } });
  t.addEventListener('blur', () => finish(true));
}
document.addEventListener('dblclick', e => { const c = e.target.closest('.card'); if (c && !e.target.closest('.card-acts') && !e.target.closest('.av')) startRename(c); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-root').innerHTML) { closeDialog(); return; }
  if ($('#app').hidden || $('#modal-root').innerHTML) return;
  const typing = e.target.closest('input,textarea,select,[contenteditable="true"]');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); return; }
  if (typing) return;
  if (e.target.matches('.card')) {
    if (e.key === 'Enter' || e.key === 'F2') { e.preventDefault(); startRename(e.target); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); const p = state.plans.find(x => x.id === e.target.dataset.id); if (p) mutate(`Deleted "${p.title}"`, () => { state.plans = state.plans.filter(x => x.id !== p.id); }); return; }
  }
  if (ui.view === 'week') {
    if (e.key === 'ArrowLeft') setWeek(addDays(ui.week, -7));
    else if (e.key === 'ArrowRight') setWeek(addDays(ui.week, 7));
  }
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (el.id === 'imp-input' && el.files && el.files[0]) { const f = el.files[0]; f.text().then(t => loadImportText(t, f.name)); return; }
  switch (d.bind) {
    case 'focus': mutate(null, () => { if (el.value) state.focus[ui.week] = el.value; else delete state.focus[ui.week]; }); break;
    case 'act': {
      const a = state.activities[+d.i]; if (!a) return;
      if (d.f === 'name') { const nn = el.value.replace(/[|,]/g, ' ').trim(); if (!nn || state.activities.some((x, j) => x.name === nn && j !== +d.i)) { render(); toast('Activity names must be unique'); return; }
        const old = a.name; mutate(`Renamed ${old} to ${nn}`, () => { a.name = nn; state.plans.forEach(p => { if (p.activity === old) { if (p.title === old) p.title = nn; p.activity = nn; } }); state.routine.forEach(r => { if (r.activity === old) r.activity = nn; }); Object.keys(state.focus).forEach(w => { if (state.focus[w] === old) state.focus[w] = nn; }); }); }
      else mutate(null, () => { a[d.f] = d.f === 'target' ? Math.max(0, parseInt(el.value) || 0) : el.value; });
      break; }
    case 'rt': mutate(null, () => { const r = state.routine[+d.i]; if (r) r[d.f] = el.value; }); break;
    case 'apply-weeks': ui.applyWeeks = +el.value; break;
    case 'exp-past': ui.expPast = el.checked; render(); break;
    case 'imp-mode': ui.imp.mode = el.value; if (ui.imp.parsed) { ui.imp.diff = diffImport(ui.imp.parsed, ui.imp.mode); render(); } break;
  }
});
document.addEventListener('input', e => {
  const d = e.target.dataset;
  if (d.bind === 'search') { ui.search = e.target.value; const t = $('#people-table'); if (t) t.innerHTML = peopleTable(); }
  else if (d.bind === 'psearch') { ui.psearch = e.target.value; const t = $('#plist'); if (t) t.innerHTML = plistHTML(); }
  else if (d.bind === 'imp-text') { ui.imp.text = e.target.value; }
});

/* ---------------- drag and drop ---------------- */
let drag = null;
const ACCEPT = {
  slot:['plan', 'activity', 'person', 'member'], card:['activity', 'person', 'member'],
  backlog:['plan', 'activity', 'person', 'member'], week:['plan'], trash:['plan', 'member']};
function dropTarget(el) {
  if (!drag || !el || !el.closest) return null;
  let t = el.closest('[data-drop]');
  while (t && !(ACCEPT[t.dataset.drop] || []).includes(drag.kind)) t = t.parentElement ? t.parentElement.closest('[data-drop]') : null;
  if (t && t.dataset.drop === 'card' && drag.kind === 'member' && t.dataset.id === drag.id) return null;
  return t;
}
const clearHover = () => $$('.drop-hover').forEach(x => x.classList.remove('drop-hover'));
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('[data-drag]'); if (!c) return;
  try { drag = JSON.parse(c.dataset.drag); } catch (er) { drag = null; return; }
  e.dataTransfer.effectAllowed = 'copyMove'; e.dataTransfer.setData('text/plain', c.dataset.drag);
  c.classList.add('is-dragging');
  const k = drag.kind;
  $('#trash').innerHTML = icon('trash') + (k === 'member' ? `Drop here to remove ${esc(drag.name)} from the plan` : 'Drop here to delete');
  requestAnimationFrame(() => { if (drag) document.body.classList.toggle('dragging', k === 'plan' || k === 'member'); });
});
document.addEventListener('dragend', () => { drag = null; document.body.classList.remove('dragging'); $$('.is-dragging').forEach(x => x.classList.remove('is-dragging')); clearHover(); });
document.addEventListener('dragover', e => {
  const fz = e.target.closest && e.target.closest('[data-filedrop]');
  if (fz && !drag) { e.preventDefault(); fz.classList.add('drop-hover'); return; }
  const t = dropTarget(e.target); if (!t) { clearHover(); return; }
  e.preventDefault();
  const copy = (drag.kind === 'plan' || drag.kind === 'member') && (e.altKey || e.ctrlKey || e.metaKey);
  e.dataTransfer.dropEffect = copy || drag.kind === 'activity' || drag.kind === 'person' ? 'copy' : 'move';
  if (!t.classList.contains('drop-hover')) { clearHover(); t.classList.add('drop-hover'); }
});
document.addEventListener('dragleave', e => { const t = e.target.closest && e.target.closest('[data-filedrop]'); if (t && !t.contains(e.relatedTarget)) t.classList.remove('drop-hover'); });
document.addEventListener('drop', e => {
  const fz = e.target.closest && e.target.closest('[data-filedrop]');
  if (fz && !drag && e.dataTransfer.files && e.dataTransfer.files[0]) { e.preventDefault(); const f = e.dataTransfer.files[0]; f.text().then(t => loadImportText(t, f.name)); return; }
  const t = dropTarget(e.target); if (!t) return;
  e.preventDefault();
  const dg = drag; drag = null; document.body.classList.remove('dragging'); clearHover();
  handleDrop(dg, t.dataset, e.altKey || e.ctrlKey || e.metaKey);
});
const newPlan = o => ({id:uid(), week:null, slot:null, title:'', activity:'Other', with:[], status:'confirmed', notes:'', ...o});
function handleDrop(dg, td, copy) {
  const P = id => state.plans.find(x => x.id === id);
  const where = td.drop === 'backlog' ? {week:null, slot:null} : {week:td.week, slot:td.slot};
  const whereTxt = () => td.drop === 'backlog' ? 'in Ideas' : `on ${slotLabel(td.week, td.slot)}`;
  if (dg.kind === 'plan') {
    const p = P(dg.id); if (!p) return;
    if (td.drop === 'trash') { mutate(`Deleted "${p.title}"`, () => { state.plans = state.plans.filter(x => x.id !== p.id); }); return; }
    if (td.drop === 'backlog') {
      if (copy) mutate(`Copied "${p.title}" to Ideas`, () => state.plans.push({...clone(p), id:uid(), week:null, slot:null}));
      else if (p.week) mutate(`Moved "${p.title}" to Ideas`, () => { p.week = null; p.slot = null; });
      return;
    }
    let week = td.week, slot = td.slot;
    if (td.drop === 'week') slot = p.slot || pickSlot(openSlots(week), actOf(p.activity).best) || freeSlots()[0];
    if (!copy && p.week === week && p.slot === slot) return;
    if (copy) mutate(`Copied "${p.title}" to ${slotLabel(week, slot)}`, () => state.plans.push({...clone(p), id:uid(), week, slot}));
    else mutate(`Moved "${p.title}" to ${slotLabel(week, slot)}${td.drop === 'week' ? ' (week ' + isoWeek(week) + ')' : ''}`, () => { p.week = week; p.slot = slot; });
  } else if (dg.kind === 'activity') {
    if (td.drop === 'card') {
      const p = P(td.id); if (!p || p.activity === dg.name) return;
      mutate(`Changed "${p.title}" to ${dg.name}`, () => editPlan(p, x => { x.activity = dg.name; }));
    } else mutate(`Added ${dg.name} ${whereTxt()}`, () => state.plans.push(newPlan({...where, title:dg.name, activity:dg.name})));
  } else if (dg.kind === 'person' || dg.kind === 'member') {
    const name = dg.name; const src = dg.kind === 'member' ? P(dg.id) : null; const move = !!src && !copy;
    const takeOut = () => { if (move) editPlan(src, x => { x.with = x.with.filter(n => n !== name); }); };
    if (td.drop === 'trash') { if (src) mutate(`Removed ${name} from "${src.title}"`, () => editPlan(src, x => { x.with = x.with.filter(n => n !== name); })); return; }
    if (td.drop === 'card') {
      const p = P(td.id); if (!p) return;
      if (p.with.includes(name)) { if (move) mutate(`Removed ${name} from "${src.title}"`, takeOut); return; }
      const title = p.title;
      mutate(move ? `Moved ${name} to "${title}"` : `Added ${name} to "${title}"`, () => { takeOut(); editPlan(p, x => { x.with = [...x.with, name]; }); });
      return;
    }
    const act = activityForPerson(personOf(name));
    mutate(`Planned ${name} ${whereTxt()}. Send the WhatsApp from the card.`, () => { takeOut(); state.plans.push(newPlan({...where, activity:act, with:[name], title:autoTitle(act, [name]), status:'tentative'})); });
  }
}

/* ---------------- theme & login ---------------- */
function setTheme(t, persist) {
  document.documentElement.dataset.theme = t;
  $('#theme-btn').innerHTML = icon(t === 'dark' ? 'sun' : 'moon');
  if (persist) store.set(THEME_KEY, t);
}
let pinBuf = '';
function drawDots() { $$('#dots i').forEach((d, i) => d.classList.toggle('on', i < pinBuf.length)); }
function pinKey(k) {
  if ($('#login').hidden) return;
  if (k === 'back') pinBuf = pinBuf.slice(0, -1);
  else if (/^\d$/.test(k) && pinBuf.length < 4) pinBuf += k;
  $('#pin-err').textContent = '';
  drawDots();
  if (pinBuf.length === 4) {
    if (pinBuf === PIN) { store.set(SESSION_KEY, '1', sessionStorage); setTimeout(showApp, 120); }
    else { const dots = $('#dots'); dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); $('#pin-err').textContent = 'Wrong PIN. Try again.'; setTimeout(() => { pinBuf = ''; drawDots(); }, 350); }
  }
}
function showLogin() {
  pinBuf = ''; drawDots(); $('#pin-err').textContent = '';
  $('#app').hidden = true; $('#login').hidden = false; closeDialog();
}
function showApp() { $('#login').hidden = true; $('#app').hidden = false; render(); }
function initLogin() {
  $('#lk-ic').innerHTML = icon('lock', 18);
  $('#keypad').innerHTML = ['1','2','3','4','5','6','7','8','9','','0','back'].map(k => k === '' ? '<button class="blank" tabindex="-1" aria-hidden="true"></button>'
    : k === 'back' ? `<button class="bk" data-k="back" aria-label="Delete digit">${icon('del', 20)}</button>` : `<button data-k="${k}">${k}</button>`).join('');
  $('#keypad').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) pinKey(b.dataset.k); });
  document.addEventListener('keydown', e => { if ($('#login').hidden) return; if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('back'); });
}

/* ---------------- boot ---------------- */
(function boot() {
  const t = store.get(THEME_KEY) || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  setTheme(t, false);
  $('#undo-btn').innerHTML = icon('undo'); $('#lock-btn').innerHTML = icon('lock');
  initLogin();
  if (store.get(SESSION_KEY, sessionStorage) === '1') showApp(); else showLogin();
  // keep "today" fresh if the app stays open overnight
  setInterval(() => { const t2 = ymd(new Date()); if (t2 !== TODAY && !$('#app').hidden && !$('#modal-root').innerHTML) render(); }, 60000);
})();
</script>
